name: Build IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Install dependencies
      run: |
        # 如果需要 CocoaPods，取消下面注释
        # sudo gem install cocoapods
        # pod install
        
    - name: Build Archive
      run: |
        # 创建构建目录
        mkdir -p build
        
        # 构建归档文件
        xcodebuild archive \
          -project Minesweeper.xcodeproj \
          -scheme Minesweeper \
          -destination "generic/platform=iOS" \
          -archivePath "build/Minesweeper.xcarchive" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
          
    - name: Create Export Options Plist
      run: |
        cat > build/ExportOptions.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string></string>
            <key>uploadSymbols</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <false/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
        </dict>
        </plist>
        EOF
        
    - name: Export IPA (Unsigned)
      run: |
        # 创建 Payload 目录
        mkdir -p build/Payload
        
        # 复制 .app 文件到 Payload
        cp -R "build/Minesweeper.xcarchive/Products/Applications/Minesweeper.app" build/Payload/
        
        # 创建 IPA 文件
        cd build
        zip -r "Minesweeper-unsigned.ipa" Payload
        cd ..
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minesweeper-IPA
        path: build/Minesweeper-unsigned.ipa
        retention-days: 30
        
    - name: Upload to Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: build/Minesweeper-unsigned.ipa
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          ## Minesweeper iOS App
          
          ### 版本信息
          - 构建号: ${{ github.run_number }}
          - 提交: ${{ github.sha }}
          - 构建时间: ${{ github.event.head_commit.timestamp }}
          
          ### 安装说明
          1. 下载 `Minesweeper-unsigned.ipa`
          2. 使用 AltStore、Sideloadly 或 Xcode 安装到 iOS 设备
          3. 需要在设置中信任开发者证书
          
          ### 功能特性
          - 三种难度级别（简单、中等、困难）
          - 自定义游戏设置
          - 游戏统计和记录
          - 音效和触觉反馈
          - 自动展开空白区域
          - 快速标记功能
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
