name: Build IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build app
      run: |
        mkdir -p build
        xcodebuild \
          -project Minesweeper.xcodeproj \
          -target Minesweeper \
          -configuration Release \
          -sdk iphoneos \
          -destination generic/platform=iOS \
          CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Verify built app
      run: |
        APP_PATH="build/Release-iphoneos/Minesweeper.app"
        test -d "$APP_PATH"
        ls -la "$APP_PATH"

    - name: Package unsigned IPA
      run: |
        rm -rf build/Payload build/Minesweeper-unsigned.ipa
        mkdir -p build/Payload
        cp -R "build/Release-iphoneos/Minesweeper.app" build/Payload/
        cd build
        zip -qry "Minesweeper-unsigned.ipa" Payload

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minesweeper-IPA
        path: build/Minesweeper-unsigned.ipa
        retention-days: 30

    - name: Upload release asset
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-build
        name: Latest Build
        body: |
          Automated unsigned IPA build.

          - Commit: ${{ github.sha }}
          - Run number: ${{ github.run_number }}
        files: build/Minesweeper-unsigned.ipa
